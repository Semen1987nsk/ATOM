# Конфигурация gitleaks. Дефолтные правила целиком плюс одно сужение: синтетические
# токены проб с префиксом `synth-` (вердикты гейта называют значение находки).
# Сужение — якорным выражением, а не стоп-словом: стоп-слово gitleaks сравнивает
# подстрокой и глушит настоящий секрет, внутри которого встретилось «synth-».
# Обоснование и замер — `.gitleaks.toml` базы знаний ЛАБОСФЕРЫ.

[extend]
useDefault = true

[[allowlists]]
description = "Синтетические токены проб: значение целиком начинается с synth- и ничем больше не является"
regexes = ['''^synth-[A-Za-z0-9._-]+$''']
