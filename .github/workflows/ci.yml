name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, 'feat/**']

# Кенселим предыдущий run на той же ветке — экономим минуты CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────── BACKEND ───────────────────
  backend:
    name: Backend (pytest + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atom
          POSTGRES_PASSWORD: atom
          POSTGRES_DB: atom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atom"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies (locked)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock \
            --extra-index-url https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple

      - name: Run alembic migrations against test DB
        working-directory: backend
        env:
          DATABASE_URL: postgresql://atom:atom@localhost:5432/atom_test
          DEBUG: 'false'
          SECRET_KEY: ci-test-secret-key-1234567890abcdefghijklmnopqrstuvwxyz
          REFRESH_SECRET_KEY: ci-test-refresh-key-fedcba0987654321zyxwvutsrqp
          # DEBUG=false → config fail-fast требует MASTER_KEY_B64 (INFRA-15).
          # Throwaway 32-byte base64 ключ только для CI-миграций.
          MASTER_KEY_B64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: |
          alembic upgrade head

      - name: Alembic check (schema drift gate)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://atom:atom@localhost:5432/atom_test
          DEBUG: 'false'
          SECRET_KEY: ci-test-secret-key-1234567890abcdefghijklmnopqrstuvwxyz
          REFRESH_SECRET_KEY: ci-test-refresh-key-fedcba0987654321zyxwvutsrqp
          MASTER_KEY_B64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        # S4-18 + S4-19 закрыли дрейф индексов → gate без continue-on-error:
        # ловит рассинхрон models.py ↔ миграций до мержа.
        run: |
          alembic check

      - name: Run pytest with coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql://atom:atom@localhost:5432/atom_test
          REDIS_URL: redis://localhost:6379/0
          DEBUG: 'true'
          SECRET_KEY: ci-test-secret-key-1234567890abcdefghijklmnopqrstuvwxyz
          REFRESH_SECRET_KEY: ci-test-refresh-key-fedcba0987654321zyxwvutsrqp
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=40 \
            --maxfail=5 \
            -q

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  # ─────────────────── BACKEND SECURITY AUDIT ───────────────────
  backend-audit:
    name: Backend (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit on locked deps
        working-directory: backend
        # Soft-fail: показываем уязвимости, но не блокируем merge
        # (заменить на --strict когда команда готова реагировать на каждое CVE).
        run: |
          pip-audit --requirement requirements.lock \
            --extra-index-url https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple \
            --format json --output audit.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-audit
          path: backend/audit.json
          retention-days: 30

  # ─────────────────── BACKEND LINT (non-blocking baseline) ───────────────────
  backend-lint:
    name: Backend (ruff + mypy — non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install linters
        run: pip install ruff mypy
      - name: Ruff (non-blocking)
        working-directory: backend
        continue-on-error: true
        run: ruff check .
      - name: Mypy (non-blocking)
        working-directory: backend
        continue-on-error: true
        run: mypy .

  # ─────────────────── FRONTEND ───────────────────
  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint (non-blocking — 13 legacy react-hooks errors, чистим в Sprint 5)
        working-directory: frontend
        continue-on-error: true
        run: npm run lint

      - name: Typecheck (hard gate)
        working-directory: frontend
        run: npm run typecheck

      - name: Test — vitest (hard gate)
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        env:
          # Достаточно фиктивных значений для type-check + build
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  # ─────────────────── DOCKER BUILD CHECK ───────────────────
  docker-build:
    name: Docker (backend image build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: atom-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
