name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, 'feat/**']

# Кенселим предыдущий run на той же ветке — экономим минуты CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────── BACKEND ───────────────────
  backend:
    name: Backend (pytest + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atom
          POSTGRES_PASSWORD: atom
          POSTGRES_DB: atom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atom"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies (locked)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock \
            --extra-index-url https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple

      - name: Run alembic migrations against test DB
        working-directory: backend
        env:
          DATABASE_URL: postgresql://atom:atom@localhost:5432/atom_test
          DEBUG: 'false'
          SECRET_KEY: ci-test-secret-key-1234567890abcdefghijklmnopqrstuvwxyz
          REFRESH_SECRET_KEY: ci-test-refresh-key-fedcba0987654321zyxwvutsrqp
          # DEBUG=false → config fail-fast требует MASTER_KEY_B64 (INFRA-15).
          # Throwaway 32-byte base64 ключ только для CI-миграций.
          MASTER_KEY_B64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: |
          alembic upgrade head

      - name: Alembic check (schema drift gate)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://atom:atom@localhost:5432/atom_test
          DEBUG: 'false'
          SECRET_KEY: ci-test-secret-key-1234567890abcdefghijklmnopqrstuvwxyz
          REFRESH_SECRET_KEY: ci-test-refresh-key-fedcba0987654321zyxwvutsrqp
          MASTER_KEY_B64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        # S4-18 + S4-19 закрыли дрейф индексов → gate без continue-on-error:
        # ловит рассинхрон models.py ↔ миграций до мержа.
        run: |
          alembic check

      - name: Run pytest with coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql://atom:atom@localhost:5432/atom_test
          REDIS_URL: redis://localhost:6379/0
          DEBUG: 'true'
          SECRET_KEY: ci-test-secret-key-1234567890abcdefghijklmnopqrstuvwxyz
          REFRESH_SECRET_KEY: ci-test-refresh-key-fedcba0987654321zyxwvutsrqp
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=40 \
            --maxfail=5 \
            -q

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  # ─────────────────── BACKEND SECURITY AUDIT ───────────────────
  backend-audit:
    name: Backend (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit on locked deps
        working-directory: backend
        # Soft-fail: показываем уязвимости, но не блокируем merge
        # (заменить на --strict когда команда готова реагировать на каждое CVE).
        run: |
          pip-audit --requirement requirements.lock \
            --extra-index-url https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple \
            --format json --output audit.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-audit
          path: backend/audit.json
          retention-days: 30

  # ─────────────────── BACKEND LINT (non-blocking baseline) ───────────────────
  backend-lint:
    name: Backend (ruff + mypy — non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install linters
        run: pip install ruff mypy
      - name: Ruff (non-blocking)
        working-directory: backend
        continue-on-error: true
        run: ruff check .
      - name: Mypy (non-blocking)
        working-directory: backend
        continue-on-error: true
        run: mypy .

  # ─────────────────── FRONTEND ───────────────────
  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint (non-blocking — 13 legacy react-hooks errors, чистим в Sprint 5)
        working-directory: frontend
        continue-on-error: true
        run: npm run lint

      - name: Typecheck (hard gate)
        working-directory: frontend
        run: npm run typecheck

      - name: Test — vitest (hard gate)
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        env:
          # Достаточно фиктивных значений для type-check + build
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  # ─────────────────── DOCKER BUILD CHECK ───────────────────
  docker-build:
    name: Docker (backend image build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: atom-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────── ХАРНЕСС: СПЕКИ, ПРОГРЕСС, ДЕФЕКТЫ ───────────────────
  # Серверное зеркало локальных .githooks. Скрипты не копируются, а берутся из
  # приватного репозитория конфига: копия разошлась бы с оригиналом молча.
  # Образец — CI базы знаний ЛАБОСФЕРЫ.
  spec-guard:
    name: Harness (spec_lint, quote/number/anchor lint, gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # secrets недоступен в if джоба и шага — флаг прокинут через env джоба.
      HAS_CONFIG_KEY: ${{ secrets.CONFIG_HOOKS_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # spec_lint датирует спеки через git log --follow, push-check ходит по before..after
          fetch-depth: 0

      - name: Секрета нет — спек-проверки пропущены
        if: env.HAS_CONFIG_KEY != 'true'
        run: echo "::warning::CONFIG_HOOKS_DEPLOY_KEY не задан — spec_lint, gate_report и push-check пропущены; реестр дефектов проверяется"

      - name: Хуки из репозитория конфига
        if: env.HAS_CONFIG_KEY == 'true'
        uses: actions/checkout@v4
        with:
          repository: Semen1987nsk/claude-code-config
          ssh-key: ${{ secrets.CONFIG_HOOKS_DEPLOY_KEY }}
          path: _claude-hooks
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - if: env.HAS_CONFIG_KEY == 'true'
        run: pip install jsonschema

      - name: spec_lint — линт спек
        if: env.HAS_CONFIG_KEY == 'true'
        # --staged = «отфильтруй кандидатов до спек»; радиус печатает gate_guard.is_spec
        run: git ls-files -z "*.md" | xargs -0r python _claude-hooks/hooks/spec_lint.py --staged

      - name: quote/number/anchor lint — добавленные строки
        if: env.HAS_CONFIG_KEY == 'true'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          RANGE=""
          if [ -n "$BASE" ]; then RANGE="$BASE..$AFTER"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then RANGE="$BEFORE..$AFTER"
          fi
          if [ -z "$RANGE" ]; then echo "диапазона нет (свежая ветка) — правила E/F/G пропущены"; exit 0; fi
          git ls-files -z "*.md" | xargs -0r python _claude-hooks/hooks/quote_lint.py --added "$RANGE"
          git ls-files -z | xargs -0r python _claude-hooks/hooks/number_lint.py --added "$RANGE"
          git ls-files -z "*.md" | xargs -0r python _claude-hooks/hooks/anchor_lint.py --intra --added "$RANGE"

      - name: gate_report — валидация вердиктов гейта
        if: env.HAS_CONFIG_KEY == 'true'
        run: git ls-files -z "*.gate.json" | xargs -0r python _claude-hooks/hooks/gate_report.py --check

      - name: push-check — REJECT без решения владельца не отгружается
        if: github.event_name == 'push' && env.HAS_CONFIG_KEY == 'true'
        env:
          GATE_GUARD_STATE_DIR: ${{ runner.temp }}/gate_state
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          printf 'refs/heads/%s %s refs/heads/%s %s\n' "$BRANCH" "$AFTER" "$BRANCH" "$BEFORE" \
            | python _claude-hooks/hooks/gate_guard.py --push-check

      - name: Реестр дефектов — строка без артефакта = незакрытый долг
        run: |
          python - <<'PY'
          import re
          import sys

          PATH = ".business/история/дефекты-у-пользователя.md"
          try:
              with open(PATH, encoding="utf-8") as fh:
                  text = fh.read()
          except FileNotFoundError:
              print(f"реестр дефектов: файла нет ({PATH}) — проверять нечего")
              sys.exit(0)

          m = re.search(r"^##\s+Реестр\s*$(.*?)(?=^##\s|\Z)", text, re.MULTILINE | re.DOTALL)
          if not m:
              print("реестр дефектов: секция «## Реестр» не найдена — проверять нечего")
              sys.exit(0)

          EMPTY = {"", "-", "—"}
          bad = []
          rows = 0
          for line in m.group(1).splitlines():
              line = line.strip()
              if not line.startswith("|"):
                  continue
              cells = [c.strip() for c in line.strip("|").split("|")]
              if all(re.fullmatch(r":?-{3,}:?", c) for c in cells):
                  continue
              rows += 1
              if rows == 1:
                  continue
              if len(cells) < 2 or cells[-1] in EMPTY:
                  bad.append(" | ".join(cells[:3]))

          if bad:
              for name in bad:
                  print(f"реестр дефектов: строка без артефакта в последней колонке: {name}")
              sys.exit(1)
          print(f"реестр дефектов: строк данных {max(rows - 1, 0)}, без артефакта 0")
          PY

  # ─────────────────── СЕКРЕТЫ ───────────────────
  gitleaks:
    name: Secrets (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Путь задан явно: action без него конфиг из корня не применяет.
          GITLEAKS_CONFIG: .gitleaks.toml
