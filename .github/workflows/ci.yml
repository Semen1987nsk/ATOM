name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Кенселим предыдущий run на той же ветке — экономим минуты CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────── BACKEND ───────────────────
  backend:
    name: Backend (pytest + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atom
          POSTGRES_PASSWORD: atom
          POSTGRES_DB: atom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atom"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies (locked)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Run alembic migrations against test DB
        working-directory: backend
        env:
          DATABASE_URL: postgresql://atom:atom@localhost:5432/atom_test
          DEBUG: 'false'
          SECRET_KEY: ci-test-secret-key-1234567890abcdefghijklmnopqrstuvwxyz
          REFRESH_SECRET_KEY: ci-test-refresh-key-fedcba0987654321zyxwvutsrqp
        run: |
          alembic upgrade head

      - name: Run pytest with coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql://atom:atom@localhost:5432/atom_test
          REDIS_URL: redis://localhost:6379/0
          DEBUG: 'true'
          SECRET_KEY: ci-test-secret-key-1234567890abcdefghijklmnopqrstuvwxyz
          REFRESH_SECRET_KEY: ci-test-refresh-key-fedcba0987654321zyxwvutsrqp
          AUTO_INIT_DB: 'true'
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=40 \
            --maxfail=5 \
            -q

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  # ─────────────────── BACKEND SECURITY AUDIT ───────────────────
  backend-audit:
    name: Backend (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit on locked deps
        working-directory: backend
        # Soft-fail: показываем уязвимости, но не блокируем merge
        # (заменить на --strict когда команда готова реагировать на каждое CVE).
        run: pip-audit --requirement requirements.lock --format json --output audit.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-audit
          path: backend/audit.json
          retention-days: 30

  # ─────────────────── FRONTEND ───────────────────
  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        # ESLint не блокирует merge — сначала очищаем легаси, потом включаем strict
        run: npm run lint || true

      - name: Build
        working-directory: frontend
        env:
          # Достаточно фиктивных значений для type-check + build
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  # ─────────────────── DOCKER BUILD CHECK ───────────────────
  docker-build:
    name: Docker (backend image build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: atom-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
