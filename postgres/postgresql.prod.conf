# postgres/postgresql.prod.conf
# Production overrides для Empirik PostgreSQL 16.
# Включает WAL-G archiving для PITR (INFRA-09).
# Mounted в docker-compose.prod.yml как /etc/postgresql/postgresql.conf.

# === Connection / Memory (для replicas: 2 backend × 4 workers × ~20 connections + pgbouncer headroom) ===
listen_addresses = '*'
max_connections = 200
shared_buffers = 512MB
work_mem = 16MB
maintenance_work_mem = 128MB
effective_cache_size = 2GB

# === WAL Archiving (INFRA-09 PITR) ===
wal_level = replica
max_wal_senders = 4
max_replication_slots = 4
wal_keep_size = 1GB
archive_mode = on
# wal-g должен быть установлен в postgres-контейнере (отдельный custom image)
# или вызываться через docker exec ... wal-g wal-push.
# Если используется community image postgres:16-alpine — wal-g нужно добавить
# через extension (см. RUNBOOK).
archive_command = 'wal-g wal-push %p'
archive_timeout = 60  # ротация WAL раз в минуту минимум

# === Checkpoints (PITR-friendly) ===
checkpoint_timeout = 5min
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 256MB

# === Logging ===
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%t [%p] %u@%d '
log_statement = 'ddl'
log_min_duration_statement = 1000  # log queries > 1s
log_checkpoints = on
log_connections = on
log_disconnections = on

# === Replication (для будущего streaming standby) ===
hot_standby = on
hot_standby_feedback = on

# === Performance ===
synchronous_commit = on  # надёжность важнее скорости для финтеха
random_page_cost = 1.1   # SSD-friendly
effective_io_concurrency = 200
