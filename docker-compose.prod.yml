# ============================================================================
#  Empirik Production Stack (INFRA-06/07/08).
#  Использует pre-built images из ghcr.io (см. .github/workflows/cd.yml).
#  Деплоится так:
#     export SHA=<git-sha>
#     docker compose -f docker-compose.prod.yml pull
#     docker compose -f docker-compose.prod.yml up -d
#
#  ─── Replicas (INFRA-08 HA) ───────────────────────────────────────────────
#  `deploy.replicas: 2` — это директива Docker Swarm. На plain
#  `docker compose` она IGNORED (compose v2 принимает её для совместимости,
#  но не разворачивает несколько инстансов).
#  Варианты под prod:
#    А) Swarm-mode: `docker swarm init` один раз + `docker stack deploy
#       -c docker-compose.prod.yml empirik` (полностью соответствует
#       директивам deploy.*).
#    Б) Plain compose: `docker compose -f docker-compose.prod.yml up -d
#       --scale backend=2 --scale frontend=2` (но требует УБРАТЬ
#       `container_name` — здесь его и нет, поэтому работает).
#  В обоих случаях имя сервиса `backend` / `frontend` резолвится в DNS на
#  оба контейнера; nginx upstream с `least_conn` (см. nginx/nginx.conf)
#  балансирует поверх.
#
#  ─── Secrets (INFRA-07) ──────────────────────────────────────────────────
#  env_file: .env — bootstrap'ится из Yandex Lockbox через
#  scripts/load_secrets.sh (см. docs/RUNBOOK.md → Secret management).
# ============================================================================

services:

  # ──────────────── Postgres 16 ────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-empirik}
      POSTGRES_USER: ${POSTGRES_USER:-empirik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required (load from Lockbox)}
      # data-checksums для durability (block corruption detection).
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # postgres/postgresql.prod.conf optional. Если файл есть, можно
      # подмонтировать и переключить command. По умолчанию — defaults.
      # - ./postgres/postgresql.prod.conf:/etc/postgresql/postgresql.conf:ro
    # max_connections поднят под топологию replicas(2)×workers(4)×(pool5+overflow10)=120.
    # Формула запаса в docs/RUNBOOK.md. Долгосрочно — pgbouncer.
    command: postgres -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-empirik} -d ${POSTGRES_DB:-empirik}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [empirik-net]
    # Postgres не выставлен наружу — доступ только через docker-network.

  # ──────────────── Redis ────────────────
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD required (load from Lockbox)}
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      # CMD-SHELL подхватывает REDIS_PASSWORD через env (двойной $ экранирует от compose).
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
    networks: [empirik-net]

  # ──────────────── Backend (FastAPI + gunicorn, replicas: 2) ────────────────
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-empirik}/empirik-backend:${SHA:-latest}
    env_file: .env
    environment:
      # API-реплики НЕ держат stream consumers/scheduler — только backend-scheduler.
      IS_SCHEDULER_WORKER: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Скриншоты сделок и логи переживают рестарт + общий volume для всех replicas.
      - uploads_data:/app/uploads
      - logs_data:/var/log/atom
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        order: start-first        # сначала поднять новый, потом убить старый — zero-downtime
        failure_action: rollback
        monitor: 30s
      restart_policy:
        condition: on-failure
        max_attempts: 3
    healthcheck:
      test: ["CMD", "curl", "-fsSL", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks: [empirik-net]

  # ──────── Backend scheduler (singleton: stream consumers + sync scheduler) ────────
  backend-scheduler:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-empirik}/empirik-backend:${SHA:-latest}
    env_file: .env
    environment:
      IS_SCHEDULER_WORKER: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/var/log/atom
    command: ["sh", "-c", "exec gunicorn main:app --worker-class uvicorn.workers.UvicornWorker --workers 1 --bind 0.0.0.0:8000 --timeout 120 --graceful-timeout 30"]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3
    restart: unless-stopped
    networks: [empirik-net]

  # ──────────────── Frontend (Next.js standalone, replicas: 2) ────────────────
  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-empirik}/empirik-frontend:${SHA:-latest}
    env_file: .env
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 30s
      restart_policy:
        condition: on-failure
        max_attempts: 3
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks: [empirik-net]

  # ──────────────── Nginx (TLS + reverse proxy + load-balancer) ────────────────
  # Один инстанс — TLS termination и распределение по upstream'ам (replicas).
  # Если nginx сам нужен HA — выносим на edge (Yandex Cloud LB) и держим
  # за ним несколько nginx-узлов. Для текущего масштаба single nginx OK.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks: [empirik-net]

  # ──────────────── Certbot (Let's Encrypt renewal loop) ────────────────
  # Первичная выдача — через scripts/init_certbot.sh (см. Batch 1).
  # Этот контейнер ходит renew каждые 12 часов; если есть expiry — обновляет
  # и nginx подхватывает через SIGHUP (вне docker; на хосте cron перезапускает nginx).
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
    networks: [empirik-net]

# ────────────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  uploads_data:
  logs_data:
  nginx_logs:
  certbot_conf:
  certbot_www:

networks:
  empirik-net:
    driver: bridge
