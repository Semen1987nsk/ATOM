# Nginx config — local/staging stack.
# Для прода: добавить TLS (certbot/caddy/traefik), security headers, gzip-static.

user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Логи в JSON для агрегации
    log_format json escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent",'
        '"x_request_id":"$http_x_request_id"'
        '}';
    access_log /var/log/nginx/access.log json;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 12M;   # синхронно с MAX_UPLOAD_SIZE_MB=10 + headroom

    # Базовые security headers (не подменяют CSP/HSTS, которые лучше через app)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    upstream atom_backend {
        server backend:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ── API ──
        location /api/ {
            proxy_pass http://atom_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ── Health probes (без префикса /api для k8s/LB) ──
        location = /health {
            proxy_pass http://atom_backend/health;
            access_log off;
        }
        location = /ready {
            proxy_pass http://atom_backend/ready;
            access_log off;
        }

        # ── Frontend ──
        # При live-deploy: либо отдельный Next.js контейнер,
        # либо статический билд из frontend/.next/static.
        location / {
            return 404 "frontend not configured";
            add_header Content-Type text/plain;
        }
    }
}
