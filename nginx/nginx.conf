# Nginx config — Empirik production stack.
# HTTP-level directives only. Server-blocks (TLS, routing) — в conf.d/*.conf.

user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Логи в JSON для агрегации
    log_format json escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent",'
        '"x_request_id":"$http_x_request_id"'
        '}';
    access_log /var/log/nginx/access.log json;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 12M;   # синхронно с MAX_UPLOAD_SIZE_MB=10 + headroom

    # INFRA-04: gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml
        text/javascript
        image/svg+xml;

    # INFRA-05: rate limit zones
    # api_lim  — общий API rate (20 req/s per IP, burst через location-level)
    # auth_lim — жёстче для логин/регистрации (5 req/s per IP)
    # conn_lim — лимит конкурентных соединений per IP
    limit_req_zone $binary_remote_addr zone=api_lim:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_lim:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_lim:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # INFRA-11: настройки proxy для forwarded-ips
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Upstream definitions — server-blocks ссылаются по имени.
    # INFRA-08: least_conn распределяет на инстанс с меньшим числом активных
    # соединений (а не round-robin) — стабильнее при долгих запросах
    # (sync прокрутка истории сделок, экспорт CSV).
    # Имя сервиса `backend`/`frontend` под Docker DNS резолвится на все
    # replicas (см. docker-compose.prod.yml: deploy.replicas: 2). На plain
    # `docker compose` потребует `--scale backend=2` (см. RUNBOOK).
    upstream empirik_backend {
        least_conn;
        server backend:8000;
        keepalive 32;
    }

    upstream empirik_frontend {
        least_conn;
        server frontend:3000;
        keepalive 16;
    }

    # Все server-блоки в conf.d (TLS + routing)
    include /etc/nginx/conf.d/*.conf;
}
