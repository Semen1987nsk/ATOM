# Empirik server-block — TLS termination + reverse proxy для backend/frontend.
# SEC-01: TLS 1.2/1.3 + HSTS + modern ciphers + OCSP stapling.
# INFRA-05: rate-limit zones применяются per-location.
# INFRA-06: frontend через proxy_pass http://frontend:3000.
# INFRA-11: X-Forwarded-* headers пробрасываются в upstream.

# ──────────────── HTTP :80 — ACME challenge + redirect на HTTPS ────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name empirik.app www.empirik.app;

    # Let's Encrypt ACME http-01 challenge — webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    # Всё остальное — постоянный редирект на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ──────────────── HTTPS :443 — основной server-block ────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name empirik.app www.empirik.app;

    # SEC-01: TLS certificates (выдаются certbot, см. scripts/init_certbot.sh)
    ssl_certificate     /etc/letsencrypt/live/empirik.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/empirik.app/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/empirik.app/chain.pem;

    # Modern TLS — только 1.2 и 1.3, никаких legacy SSLv3/TLSv1.0/1.1
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;

    # Session resumption — производительность handshake
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling — снижает RTT клиента при revocation check
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # HSTS — браузер запоминает HTTPS на год + preload + sub-domains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # INFRA-05: глобальный conn-limit на server level
    limit_conn conn_lim 50;

    # ──────────────── Health probes — без rate-limit, без логов ────────────────
    location = /health {
        proxy_pass http://empirik_backend/health;
        access_log off;
        proxy_set_header Host $host;
    }
    location = /ready {
        proxy_pass http://empirik_backend/ready;
        access_log off;
        proxy_set_header Host $host;
    }

    # ──────────────── /metrics — internal-only (Docker network) ────────────────
    location = /metrics {
        # Docker bridge / overlay network ranges
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://empirik_backend/metrics;
        access_log off;
        proxy_set_header Host $host;
    }

    # ──────────────── Auth endpoints — жёсткий rate-limit ────────────────
    location /auth/ {
        limit_req zone=auth_lim burst=10 nodelay;

        proxy_pass http://empirik_backend/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ──────────────── API — общий rate-limit ────────────────
    location /api/ {
        limit_req zone=api_lim burst=40 nodelay;

        proxy_pass http://empirik_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ──────────────── Backend-only paths (без /api префикса) ────────────────
    # Эндпоинты FastAPI, доступные напрямую — пробрасываем как /api с общим rate-limit.
    location ~ ^/(broker|trades|stats|admin|onboarding|capital|market|tags|positions|operations|reconciliation|review|replay|export|imports)(/|$) {
        limit_req zone=api_lim burst=40 nodelay;

        proxy_pass http://empirik_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ──────────────── Next.js static — длинный кеш + immutable ────────────────
    location /_next/static/ {
        proxy_pass http://empirik_frontend;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ──────────────── Frontend (Next.js) — всё остальное ────────────────
    location / {
        proxy_pass http://empirik_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
